<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCB Calc</title>
<style>
:root{
  --bg:#fbf6e4; --surface:#fffdf6; --border:#e6dcb8; --text:#263320; --text-dim:#6d7357;
  --accent:#2e7d4f; --accent-dim:#e3eed5; --danger:#c0392b; --ok:#2e7d4f; --flash:#ffe58a;
  --gold:#f2b705; --gold-dim:#e9d996; --hexink:#3a2a00; --scrub-ink:#1d2a10;
  --radius:6px; --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121812; --surface:#1a221a; --border:#2e3a2a; --text:#ece9d6; --text-dim:#a2a88c;
    --accent:#5cbf80; --accent-dim:#24361f; --flash:#5f4d10; --shadow:none;
    --gold:#e3ac0b; --gold-dim:#6b5a1c; --hexink:#241a00;
  }
}
:root[data-theme="dark"]{
  --bg:#121812; --surface:#1a221a; --border:#2e3a2a; --text:#ece9d6; --text-dim:#a2a88c;
  --accent:#5cbf80; --accent-dim:#24361f; --flash:#5f4d10; --shadow:none;
  --gold:#e3ac0b; --gold-dim:#6b5a1c; --hexink:#241a00;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#app{min-height:100%;display:flex;flex-direction:column}
#app-header{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;
  padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--border);
}
.icon-btn{
  background:none;border:none;color:var(--text);cursor:pointer;font-size:20px;
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:var(--accent-dim)}
.icon-btn.hidden-btn{visibility:hidden}
.brand{display:flex;align-items:baseline;gap:8px;font-size:15px}
.brand-name{font-weight:600}
.brand-sep{color:var(--text-dim)}
.brand-sub{font-weight:600}
.brand-sub .dirty{color:var(--accent);margin-left:2px}
#app-main{flex:1;padding:22px;max-width:1400px;width:100%;margin:0 auto}

/* Index: see honeycomb styles below */

/* Calculator page layout */
.calc-page{display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0}
.tab-btn{
  background:none;border:none;padding:9px 14px;font-size:13px;color:var(--text-dim);cursor:pointer;
  border-bottom:2px solid transparent;font-family:inherit;
}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-btn:hover{color:var(--text)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 4px}
.subtab-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;
  font-size:12px;cursor:pointer;color:var(--text-dim);font-family:inherit;
}
.subtab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

.calc-columns{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:900px){.calc-columns{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:14px}
.side-panel{font-size:13px;color:var(--text-dim);line-height:1.5}
.side-panel h4{margin:14px 0 6px;font-size:12.5px;color:var(--text);text-transform:uppercase;letter-spacing:.4px}
.side-panel h4:first-child{margin-top:0}

.field-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.field-label{width:150px;flex-shrink:0;font-size:13px;color:var(--text-dim)}
.field-input{
  flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);
  color:var(--text);font-size:13.5px;font-family:inherit;transition:background .25s ease;
}
.field-input:focus{outline:none;border-color:var(--accent)}
.field-input[readonly]{cursor:default}
.field-unit{
  padding:7px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);
  font-size:12.5px;font-family:inherit;
}
.field-remove{
  background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;width:26px;flex-shrink:0;
}
.field-remove:hover{color:var(--danger)}
.flash{background:var(--flash) !important}
.add-row-btn{
  background:none;border:1px dashed var(--border);border-radius:7px;color:var(--accent);
  padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;margin-top:2px;
}
.add-row-btn:hover{border-color:var(--accent)}
.output-block{
  background:var(--accent-dim);border-radius:8px;padding:10px 14px;margin-top:6px;
}
.output-block .field-label{color:var(--text)}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0}

.formula{font-size:15px;margin:6px 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 2px;line-height:1.15}
.frac .num{padding:0 3px 1px;border-bottom:1.4px solid currentColor}
.frac .den{padding:1px 3px 0}
sub,sup{font-size:70%}
.placeholder{padding:60px 20px;text-align:center;color:var(--text-dim)}

/* Confirm dialog */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100;
}
.overlay.hidden{display:none}
.confirm-box{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;
  width:320px;box-shadow:var(--shadow);
}
.confirm-box p{margin:0 0 16px;font-size:14px}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px}
.confirm-actions button{
  border:none;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;
}
#confirm-save{background:var(--accent);color:#fff}
#confirm-discard{background:var(--bg);color:var(--danger);border:1px solid var(--border) !important}
#confirm-cancel{background:var(--bg);color:var(--text);border:1px solid var(--border) !important}
/* Number inputs: no spinner arrows */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* Scrub handle: drag horizontally over it to change the value */
.scrub{
  width:36px;height:30px;flex-shrink:0;border-radius:6px;cursor:ew-resize;touch-action:none;position:relative;
  background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.13) 3px 4px),linear-gradient(90deg,var(--accent),var(--gold));
  transition:filter .15s,transform .15s;animation:scrubring 1.4s ease .4s 2;
}
.scrub::before,.scrub::after{content:"";position:absolute;top:50%;width:0;height:0;border:5px solid transparent;transform:translateY(-50%)}
.scrub::before{left:2px;border-right-color:var(--scrub-ink);border-left-width:0}
.scrub::after{right:2px;border-left-color:var(--scrub-ink);border-right-width:0}
.scrub:hover{filter:brightness(1.12)}
.scrub.active{transform:scaleY(1.12);filter:brightness(1.2)}
@keyframes scrubring{0%{box-shadow:0 0 0 0 var(--gold)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* Honeycomb index */
.hive{margin:0 auto}
#app-main:has(.hive){display:flex;align-items:center;justify-content:center}
.hive{margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:900px;width:100%}
#app-main:has(.hive){display:flex;align-items:center;justify-content:center}
.hex{
  aspect-ratio:1;border-radius:18px;
  background:var(--gold);color:var(--hexink);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:0 16px;text-align:center;cursor:pointer;transition:background .15s,color .15s;
}
.hex:hover{background:var(--accent);color:#fff}
.hex.disabled{background:var(--gold-dim);opacity:.55;cursor:default}
.hex.disabled:hover{background:var(--gold-dim);color:var(--hexink)}
.hex svg{width:34px;height:34px}
.hex-title{font-size:13px;font-weight:600;line-height:1.2}

/* Theme slider */
.theme-toggle{position:relative;display:inline-block;cursor:pointer;flex-shrink:0}
.theme-toggle input{position:absolute;opacity:0;width:0;height:0}
.theme-toggle .track{display:flex;align-items:center;justify-content:space-between;width:56px;height:28px;padding:0 6px;border-radius:14px;background:var(--accent-dim);border:1px solid var(--border);position:relative;color:var(--text-dim)}
.theme-toggle .track svg{width:14px;height:14px;z-index:1}
.theme-toggle .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--gold);transition:transform .2s ease}
.theme-toggle input:checked + .track .knob{transform:translateX(28px)}
.theme-toggle input:focus-visible + .track{outline:2px solid var(--accent)}

/* Header search */
.header-search{flex:1;display:flex;justify-content:center;min-width:0;padding:0 8px}
.search-box{position:relative;width:100%;max-width:420px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
#search-input{
  width:100%;padding:7px 12px 7px 32px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;
}
#search-input:focus{outline:none;border-color:var(--accent)}
.search-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow-y:auto;z-index:50;text-align:left;
}
.search-dropdown.hidden{display:none}
.search-row{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px}
.search-row:hover{background:var(--accent-dim)}
.search-row .sr-icon{color:var(--text-dim);flex-shrink:0;display:flex}
.search-row .sr-main{font-weight:600;color:var(--text)}
.search-row .sr-sub{color:var(--text-dim);font-size:11.5px;margin-top:1px}
.search-row .sr-del{margin-left:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;padding:2px 7px;border-radius:4px;font-size:15px;flex-shrink:0}
.search-row .sr-del:hover{color:var(--danger);background:var(--bg)}
.search-hist-head{display:flex;align-items:center;padding:9px 12px 3px;font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px}
.search-hist-head button{margin-left:auto;background:none;border:none;color:var(--accent);cursor:pointer;font-size:11px;font-family:inherit;text-transform:none;letter-spacing:0}
.search-empty{padding:18px 12px;color:var(--text-dim);font-size:12.5px;text-align:center}
@media (max-width:760px){ .header-search{display:none} }

/* Generic on/off switch */
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;border-radius:12px;background:var(--border);transition:background .2s}
.switch .slider::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider::before{transform:translateX(20px);background:var(--gold)}
.switch input:focus-visible + .slider{outline:2px solid var(--accent)}

/* Index groups */
.hive-wrap{width:100%}
.group-title{text-align:center;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin:18px 0 12px}
.hive-wrap .group-title:first-child{margin-top:0}

/* Pinout tables */
.pin-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px}
.pin-table th,.pin-table td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
.pin-table th{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px}
.pin-table tr:nth-child(even) td{background:var(--bg)}
.pin-table td:first-child{font-weight:600;color:var(--accent)}

/* Stackup builder */
.sk-card{border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:14px;cursor:pointer;transition:border-color .15s}
.sk-card:hover{border-color:var(--accent)}
.sk-card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.sk-card-head strong{font-size:13.5px}
.sk-meta{font-size:11.5px;color:var(--text-dim)}
.sk-diagram{border:1px solid var(--border);border-radius:4px;overflow:hidden}
.sk-layer{display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px;color:#fff;border-bottom:1px solid rgba(0,0,0,.18)}
.sk-layer:last-child{border-bottom:none}
.sk-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin:8px 0 4px}
.sk-legend span{display:inline-flex;align-items:center;gap:5px}
.sk-legend i{width:11px;height:11px;border-radius:2px;display:inline-block}

/* Stackup / Dielectric: Digikey-style facet sidebar */
.sk-filter-layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.sk-filter-layout{grid-template-columns:1fr}}
.sk-filter-panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px;position:sticky;top:70px}
.sk-filter-group{margin-bottom:16px}
.sk-filter-group h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-dim)}
.sk-filter-opt{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;cursor:pointer}
.sk-filter-opt input{accent-color:var(--accent);flex-shrink:0}
.sk-filter-opt.disabled{opacity:.38;cursor:default}
.sk-filter-opt .sk-count{margin-left:auto;font-size:11px;color:var(--text-dim)}
.sk-results-panel{min-width:0}
.sk-modal-box{width:min(880px,92vw);max-height:86vh;overflow-y:auto}
.sk-layer-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.sk-layer-num{width:16px;font-size:11px;color:var(--text-dim);text-align:right;flex-shrink:0}
.sk-btn{border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px;font-family:inherit;border:1px solid var(--border)}
.sk-btn-primary{background:var(--accent);color:#fff;border:none}
.sk-btn-danger{background:var(--bg);color:var(--danger)}
.sk-btn-plain{background:var(--bg);color:var(--text)}
.sk-imp-table{width:100%;border-collapse:collapse;font-size:13px}
.sk-imp-table th,.sk-imp-table td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
.sk-imp-table th{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px}
.sk-imp-table td:first-child{font-weight:600}
.sk-imp-table td.na{color:var(--text-dim);font-style:italic}

/* Dielectric spec table */
.spec-table{width:100%;border-collapse:collapse;font-size:12.5px}
.spec-table th,.spec-table td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.spec-table th{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;background:var(--surface)}
.spec-table td:first-child,.spec-table th:first-child{position:sticky;left:0;background:var(--surface);white-space:normal}
.spec-table tr.grp td{background:var(--accent-dim);color:var(--accent);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:static}
.spec-table tr.key td:first-child{font-weight:700;color:var(--text)}
.spec-table tr.key td{background:var(--flash)}

/* Index groups */
/* Pinout tables */
.pin-table{width:100%;border-collapse:collapse;font-size:13px}
.pin-table th{text-align:left;color:var(--text-dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
.pin-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.pin-dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.t-p{background:#c0392b}.t-g{background:#7b8060}.t-s{background:var(--accent)}.t-c{background:var(--gold)}.t-n{background:var(--border)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--text-dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div id="app">
  <header id="app-header">
    <label class="theme-toggle"><input type="checkbox" id="theme-switch" aria-label="Dark mode"><span class="track">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <span class="knob"></span></span></label>
    <button id="back-btn" class="icon-btn hidden-btn" aria-label="Back">&#8592;</button>
    <div class="brand"><span class="brand-name">PCB Calc</span><span class="brand-sep" id="brand-sep">|</span><span class="brand-sub" id="brand-sub"></span></div>
    <div class="header-search">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search-input" type="text" placeholder="Search calculators, tabs…" autocomplete="off" spellcheck="false">
        <div id="search-dropdown" class="search-dropdown hidden"></div>
      </div>
    </div>
    <button id="settings-btn" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="app-main"></main>
</div>

<div id="confirm-overlay" class="overlay hidden">
  <div class="confirm-box">
    <p id="confirm-text">You have unsaved changes. Save before leaving?</p>
    <div class="confirm-actions">
      <button id="confirm-save">Save</button>
      <button id="confirm-discard">Discard</button>
      <button id="confirm-cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="settings-overlay" class="overlay hidden">
  <div class="confirm-box" style="width:360px">
    <div style="display:flex;align-items:center;margin-bottom:16px">
      <strong style="font-size:15px">Settings</strong>
      <button id="settings-close" class="icon-btn" style="margin-left:auto" aria-label="Close">&times;</button>
    </div>
    <div class="field-row" style="margin:0 0 16px">
      <div class="field-label" style="flex:1;color:var(--text)">Autosave</div>
      <label class="switch"><input type="checkbox" id="autosave-switch"><span class="slider"></span></label>
    </div>
    <hr class="sep">
    <div style="font-size:13px;color:var(--text);font-weight:600;margin-bottom:8px">Backup &amp; Restore</div>
    <div style="display:flex;gap:8px">
      <button id="settings-export" class="add-row-btn" style="flex:1">Download Backup</button>
      <label class="add-row-btn" style="flex:1;text-align:center;cursor:pointer;margin:0">Restore from File
        <input type="file" id="settings-import" accept="application/json" style="display:none">
      </label>
    </div>
    <p style="font-size:11.5px;color:var(--text-dim);margin-top:8px">Includes all saved calculator values, custom stackups, and settings. Restoring replaces everything currently saved on this device.</p>
  </div>
</div>

<div id="stackup-info-overlay" class="overlay hidden">
  <div class="confirm-box sk-modal-box">
    <div style="display:flex;align-items:center;margin-bottom:14px">
      <strong id="sk-modal-title" style="font-size:15px"></strong>

<script>
/* =========================================================
   SECTION: UNIT CONVERSION
========================================================= */
const UNIT_DEFS = {
  resistance:{units:{'μΩ':1e-6,'mΩ':1e-3,'Ω':1,'kΩ':1e3,'MΩ':1e6}, def:'Ω'},
  capacitance:{units:{'pF':1e-12,'nF':1e-9,'µF':1e-6,'mF':1e-3,'F':1}, def:'nF'},
  inductance:{units:{'nH':1e-9,'µH':1e-6,'mH':1e-3,'H':1}, def:'µH'},
  voltage:{units:{'µV':1e-6,'mV':1e-3,'V':1,'kV':1e3}, def:'V'},
  current:{units:{'µA':1e-6,'mA':1e-3,'A':1}, def:'A'},
  power:{units:{'mW':1e-3,'W':1,'kW':1e3}, def:'W'},
  length:{units:{'µm':0.001,'mil':0.0254,'mm':1,'cm':10,'in':25.4,'m':1000}, def:'mm'},
  frequency:{units:{'Hz':1,'kHz':1e3,'MHz':1e6,'GHz':1e9}, def:'MHz'},
  time:{units:{'ps':1e-12,'ns':1e-9,'µs':1e-6,'ms':1e-3,'s':1,'min':60}, def:'s'},
  angle:{units:{'°':1,'rad':180/Math.PI}, def:'°'},
  temperature:{units:{'°C':1,'°F':1,'K':1}, def:'°C'}, // multipliers unused; conversion is offset-based, see tempToBase/tempFromBase
};
function tempToBase(value, unit){ // returns Celsius
  if(unit==='°F') return (value-32)*5/9;
  if(unit==='K') return value-273.15;
  return value;
}
function tempFromBase(valueC, unit){ // Celsius -> target unit
  if(unit==='°F') return valueC*9/5+32;
  if(unit==='K') return valueC+273.15;
  return valueC;
}
// Fields without a unit category (e.g. dimensionless ratios) pass through unconverted.
function toBase(value, unit, cat){
  if(cat==='temperature') return tempToBase(value, unit);
  if(!cat || !UNIT_DEFS[cat]) return value;
  return value * UNIT_DEFS[cat].units[unit];
}
function fromBase(value, unit, cat){
  if(cat==='temperature') return tempFromBase(value, unit);
  if(!cat || !UNIT_DEFS[cat]) return value;
  return value / UNIT_DEFS[cat].units[unit];
}
function fmt(n){
  if(!isFinite(n)) return '—';
  if(n===0) return '0';
  const a=Math.abs(n);
  if(a>=1e6||a<1e-4) return n.toExponential(4);
  return parseFloat(n.toPrecision(6)).toString();
}

/* =========================================================
   SECTION: STATE MANAGEMENT (per-calculator data + dirty flag)
========================================================= */
const Store = {
  load(id){
    try{ const raw=localStorage.getItem('pcbcalc:'+id); return raw?JSON.parse(raw):null; }catch(e){ return null; }
  },
  save(id, data){
    try{ localStorage.setItem('pcbcalc:'+id, JSON.stringify(data)); return true; }catch(e){ return false; }

};
const Settings = Object.assign({ autosave:false }, Store.load('settings') || {});
const App = {
  currentId:null,
  dirty:false,
  pendingNav:null,
  markDirty(v){
    if(v && Settings.autosave){
      const m = CalculatorModules[this.currentId];
      if(m && m.save){ m.save(); v = false; }
    }
    this.dirty = v;
    renderTitle();
  }
};
function renderTitle(){
  const meta = CALCULATORS.find(c=>c.id===App.currentId);

const CALCULATORS = [

  {id:'e-series', title:'E-Series Resistors', group:'toolbox', ready:true,
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 12h4l2-6 4 12 2-6h8"/></svg>'},
  {id:'cap-decoder', title:'Capacitor Decoder', group:'toolbox', ready:true,
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h7M15 12h7M9 5v14M15 5v14"/></svg>'},

  {id:'stackup', title:'Stackup', group:'toolbox', ready:true,
   icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="3" rx="0.5"/><rect x="3" y="8" width="18" height="5" rx="0.5"/><rect x="3" y="14.5" width="18" height="3" rx="0.5"/><rect x="3" y="19" width="18" height="1.5" rx="0.5"/></svg>'},
];

/* =========================================================
   SECTION: ROUTER
========================================================= */
function currentRouteId(){
  const h = location.hash.replace(/^#\/?/, '');
  return h || null;
}
let suppressHashChange = false;
let navStack = [];      // ids of pages visited, so back goes where the user actually came from
let navigatingBack = false;
window.addEventListener('hashchange', ()=>{
  if(suppressHashChange){ suppressHashChange = false; return; }
  const target = currentRouteId();
  if(App.dirty && App.currentId){
    App.pendingNav = target;
    suppressHashChange = true;
    location.hash = App.currentId; // revert visually; the resulting hashchange is suppressed above
    openConfirm();
    return;
  }
  if(!navigatingBack && App.currentId!==undefined && App.currentId!==target){ navStack.push(App.currentId); }
  navigatingBack = false;
  navigateTo(target);
});
document.getElementById('back-btn').addEventListener('click', ()=>{
  navigatingBack = true;
  const prev = navStack.pop();
  location.hash = (prev !== undefined && prev !== null) ? prev : '';
});
function navigateTo(id){
  App.currentId = id;
  App.dirty = false;
  const backBtn = document.getElementById('back-btn');
  const main = document.getElementById('app-main');
  if(!id){
    backBtn.classList.add('hidden-btn');
    renderTitle();
    renderIndex(main);
  } else {
    backBtn.classList.remove('hidden-btn');
    const meta = CALCULATORS.find(c=>c.id===id);
    renderTitle();
    const module = CalculatorModules[id];
    if(module){ module.render(main); }
    else { main.innerHTML = '<div class="placeholder">This calculator isn\'t built yet. Check back soon.</div>'; }
  }
}

/* =========================================================
   SECTION: CONFIRM DIALOG (save / discard / cancel on exit)
========================================================= */
const overlay = document.getElementById('confirm-overlay');
function openConfirm(){ overlay.classList.remove('hidden'); }
function closeConfirm(){ overlay.classList.add('hidden'); }
document.getElementById('confirm-save').addEventListener('click', ()=>{
  const module = CalculatorModules[App.currentId];
  if(module && module.save) module.save();
  App.dirty = false;
  closeConfirm();
  const target = App.pendingNav; App.pendingNav=null;
  location.hash = target || '';
});
document.getElementById('confirm-discard').addEventListener('click', ()=>{
  App.dirty = false;
  closeConfirm();
  const target = App.pendingNav; App.pendingNav=null;
  location.hash = target || '';
});
document.getElementById('confirm-cancel').addEventListener('click', ()=>{
  App.pendingNav = null;
  closeConfirm();
});
document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){
    e.preventDefault();
    const module = CalculatorModules[App.currentId];
    if(module && module.save){
      module.save();
      App.markDirty(false);
    }
  }
});

/* =========================================================
   SECTION: INDEX PAGE
========================================================= */
function renderIndex(main){
  const GROUPS = [{id:'quick', title:'Quick Math'}, {id:'toolbox', title:'Toolbox'}];
  const card = c => `<div class="hex ${c.ready?'':'disabled'}" data-id="${c.id}">${c.icon}<div class="hex-title">${c.title}</div></div>`;
  let html = '<div class="hive-wrap">';
  for(const g of GROUPS){
    const items = CALCULATORS.filter(c => (c.group || 'quick') === g.id);
    html += `<div class="group-title">${g.title}</div><div class="hive">${items.map(card).join('')}</div>`;
  }
  html += '</div>';
  main.innerHTML = html;
  main.querySelectorAll('.hex').forEach(card=>{
    card.addEventListener('click', ()=>{ location.hash = card.dataset.id; });

}

/* =========================================================
   SECTION: REUSABLE UI BUILDERS
========================================================= */
// Simple fixed-field calculator (e.g. I = V/R style forms)
function buildSimpleCalc(root, cfg){
  // cfg: {storageId, fields:[{key,label,cat,unit} | {key,label,type:'select',options:[{value,label}]}], outputs:[...], compute(vals)->{key:value}, formulaHTML, notesHTML}
  const saved = Store.load(cfg.storageId) || {};
  const state = {};
  cfg.fields.forEach(f=>{
    const def = f.type==='select' ? f.options[0].value : (f.default ?? 0);
    state[f.key] = { value: saved[f.key]?.value ?? def, unit: saved[f.key]?.unit ?? f.unit };
  });
  cfg.outputs.forEach(o=>{ state[o.key] = { value:0, unit: o.unit }; });

  let left = '<div class="panel"><h3>'+cfg.title+'</h3>';
  cfg.fields.forEach(f=>{
    left += fieldRowHTML(f, state[f.key], false);
  });
  left += '<hr class="sep">';
  cfg.outputs.forEach(o=>{
    left += `<div class="output-block">${fieldRowHTML(o, state[o.key], !o.editable)}</div>`;
  });
  left += '</div>';

  const right = `<div class="panel side-panel">${cfg.formulaHTML}${cfg.notesHTML||''}</div>`;
  root.innerHTML = `<div class="calc-columns">${left}${right}</div>`;

  function currentBase(){
    const baseVals = {};
    cfg.fields.forEach(f=>{
      baseVals[f.key] = f.type==='select' ? state[f.key].value : toBase(parseFloat(state[f.key].value)||0, state[f.key].unit, f.cat);
    });
    return baseVals;
  }
  function recompute(skipKey){
    const results = cfg.compute(currentBase());
    cfg.outputs.forEach(o=>{
      if(o.key===skipKey) return;
      const baseVal = results[o.key];
      state[o.key].value = fromBase(baseVal, state[o.key].unit, o.cat);
      const input = root.querySelector('[data-field="'+o.key+'"]');
      if(input){ input.value = fmt(state[o.key].value); flashEl(input); }
    });
  }
  cfg.fields.forEach(f=>{
    const input = root.querySelector('[data-field="'+f.key+'"]');
    if(f.type==='select'){
      input.addEventListener('change', ()=>{ state[f.key].value = input.value; App.markDirty(true); recompute(); });
      return;
    }
    const unitSel = root.querySelector('[data-unit="'+f.key+'"]');
    input.addEventListener('input', ()=>{
      state[f.key].value = parseFloat(input.value)||0;
      App.markDirty(true);
      recompute();
    });
    if(unitSel){
      unitSel.addEventListener('change', ()=>{
        const oldUnit = state[f.key].unit;
        const newUnit = unitSel.value;
        const baseVal = toBase(parseFloat(input.value)||0, oldUnit, f.cat);
        state[f.key].value = fromBase(baseVal, newUnit, f.cat);
        state[f.key].unit = newUnit;
        input.value = fmt(state[f.key].value);
        flashEl(input);
        App.markDirty(true);
        recompute();
      });
    }
  });
  cfg.outputs.forEach(o=>{
    const unitSel = root.querySelector('[data-unit="'+o.key+'"]');
    if(unitSel){
      unitSel.addEventListener('change', ()=>{ state[o.key].unit = unitSel.value; recompute(); });
    }
    // Bidirectional: editing this output back-solves the inputs via cfg.inverse[key](baseVals, outputBaseValue)
    const oin = root.querySelector('[data-field="'+o.key+'"]');
    if(o.editable && oin && cfg.inverse && cfg.inverse[o.key]){
      oin.addEventListener('input', ()=>{
        const val = parseFloat(oin.value)||0;
        state[o.key].value = val;
        const upd = cfg.inverse[o.key](currentBase(), toBase(val, state[o.key].unit, o.cat));
        cfg.fields.forEach(f=>{
          if(upd[f.key]===undefined) return;
          let nv = fromBase(upd[f.key], state[f.key].unit, f.cat);
          if(f.round && f.round[state[f.key].unit]!==undefined){
            const d = f.round[state[f.key].unit], p = Math.pow(10,d);
            nv = Math.round(nv*p)/p;
          }
          state[f.key].value = nv;
          const fin = root.querySelector('[data-field="'+f.key+'"]');
          fin.value = fmt(state[f.key].value);
          flashEl(fin);
        });
        App.markDirty(true);
        recompute(o.key);
      });
    }
  });
  wireScrubs(root);
  recompute();
  return {
    save(){ const out={}; cfg.fields.forEach(f=>{ out[f.key]={value:state[f.key].value, unit:state[f.key].unit}; }); Store.save(cfg.storageId, out); }
  };
}
function fieldRowHTML(f, s, readonly){
  if(f.type==='select'){
    const opts = f.options.map(o=>`<option value="${o.value}" ${o.value===s.value?'selected':''}>${o.label}</option>`).join('');
    return `<div class="field-row">
      <div class="field-label">${f.label}</div>
      <select class="field-input" data-field="${f.key}">${opts}</select>
    </div>`;
  }
  const unitOpts = UNIT_DEFS[f.cat] ? Object.keys(UNIT_DEFS[f.cat].units).map(u=>`<option value="${u}" ${u===s.unit?'selected':''}>${u}</option>`).join('') : '';
  return `<div class="field-row">
    <div class="field-label">${f.label}</div>
    <input class="field-input" data-field="${f.key}" type="${readonly?'text':'number'}" step="any" value="${readonly?fmt(s.value):s.value}" ${readonly?'readonly':''}>
    ${readonly?'':'<div class="scrub"></div>'}
    ${UNIT_DEFS[f.cat]?`<select class="field-unit" data-unit="${f.key}">${unitOpts}</select>`:''}
  </div>`;
}

// Drag horizontally on a .scrub handle to change the number input right before it.
function wireScrubs(root){
  root.querySelectorAll('.scrub').forEach(h=>{
    const inp = h.previousElementSibling;
    if(!inp) return;
    let drag = null;
    h.addEventListener('pointerdown', e=>{
      e.preventDefault();
      h.setPointerCapture(e.pointerId);
      const v0 = parseFloat(inp.value)||0;
      const unit = h.nextElementSibling && h.nextElementSibling.value;
      drag = { x0:e.clientX, v0, step:Math.pow(10, Math.floor(Math.log10(Math.abs(v0)||1)) - 2), neg: v0<0 || unit==='°C' || unit==='°F' };
      h.classList.add('active');
    });
    h.addEventListener('pointermove', e=>{
      if(!drag) return;
      let v = drag.v0 + (e.clientX - drag.x0) * drag.step * (e.shiftKey ? 0.1 : 1);
      if(v<0 && !drag.neg) v = 0;
      inp.value = String(parseFloat(v.toPrecision(6)));
      inp.dispatchEvent(new Event('input'));
    });
    const end = ()=>{ drag = null; h.classList.remove('active'); };
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);
  });
}

// Generic tabbed calculator shell (tabs row + swappable body), reused by any multi-subsection calculator.
// opts: {sub: boolean styling flag, persistKey: string} — persistKey, if given, remembers the last
// active tab across visits (via TabMemory, not Store/dirty) so it isn't a "save" and never prompts.
const TabMemory = {
  load(key){ try{ return localStorage.getItem('pcbcalc:tabmem:'+key) || null; }catch(e){ return null; } },
  save(key, id){ try{ localStorage.setItem('pcbcalc:tabmem:'+key, id); }catch(e){} }
};
function buildTabbedCalculator(main, tabs, renderFn, opts){
  opts = (opts===true) ? {sub:true} : (opts || {});
  const rowCls = opts.sub ? 'subtabs' : 'tabs', btnCls = opts.sub ? 'subtab-btn' : 'tab-btn';
  const remembered = opts.persistKey ? TabMemory.load(opts.persistKey) : null;
  const startId = (remembered && tabs.some(t=>t.id===remembered)) ? remembered : tabs[0].id;
  main.innerHTML = `<div class="calc-page">
    <div class="${rowCls}">${tabs.map(t=>`<button class="${btnCls}" data-tab="${t.id}">${t.label}</button>`).join('')}</div>
    <div class="tab-body"></div>
  </div>`;
  const body = main.querySelector('.tab-body');
  let active = null;
  function setActive(id){
    main.querySelectorAll('.'+btnCls).forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
    active = renderFn(id, body);
    if(opts.persistKey) TabMemory.save(opts.persistKey, id);
  }
  main.querySelectorAll('.'+btnCls).forEach(b=>b.addEventListener('click', ()=>setActive(b.dataset.tab)));
  setActive(startId);
  return { save(){ if(active && active.save) active.save(); } };
}

// Multi-component series/parallel calculator (R, C, L)
function buildMultiCompCalc(root, cfg){
  // cfg: {storageId, title, cat, mode:'series'|'parallel', combine(baseValsArray)->baseTotal, formulaHTML, notesHTML, defaultUnit}
  const saved = Store.load(cfg.storageId);
  let rows = saved && saved.rows ? saved.rows : [ {value:100, unit:cfg.defaultUnit}, {value:100, unit:cfg.defaultUnit} ];
  let totalUnit = saved && saved.totalUnit ? saved.totalUnit : cfg.defaultUnit;

  function render(){
    let rowsHTML = rows.map((r,i)=>{
      const unitOpts = Object.keys(UNIT_DEFS[cfg.cat].units).map(u=>`<option value="${u}" ${u===r.unit?'selected':''}>${u}</option>`).join('');
      return `<div class="field-row" data-row="${i}">
        <div class="field-label">Component ${i+1}</div>
        <input class="field-input" type="number" step="any" value="${r.value}" data-row-input="${i}">
        <div class="scrub"></div>
        <select class="field-unit" data-row-unit="${i}">${unitOpts}</select>
        <button class="field-remove" data-row-remove="${i}" title="Remove">&times;</button>
      </div>`;
    }).join('');
    const totalUnitOpts = Object.keys(UNIT_DEFS[cfg.cat].units).map(u=>`<option value="${u}" ${u===totalUnit?'selected':''}>${u}</option>`).join('');
    const left = `<div class="panel"><h3>${cfg.title}</h3>
      ${rowsHTML}
      <button class="add-row-btn" id="add-row">+ Add component</button>
      <hr class="sep">
      <div class="output-block field-row">
        <div class="field-label">Total</div>
        <input class="field-input" id="total-out" type="text" readonly value="">
        <select class="field-unit" id="total-unit">${totalUnitOpts}</select>
      </div>
    </div>`;
    const right = `<div class="panel side-panel">${cfg.formulaHTML}${cfg.notesHTML||''}</div>`;
    root.innerHTML = `<div class="calc-columns">${left}${right}</div>`;
    wire();
    compute();
  }
  function wire(){
    wireScrubs(root);
    root.querySelectorAll('[data-row-input]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const i = +inp.dataset.rowInput;
        rows[i].value = parseFloat(inp.value)||0;
        App.markDirty(true);
        compute();
      });
    });
    root.querySelectorAll('[data-row-unit]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const i = +sel.dataset.rowUnit;
        const oldUnit = rows[i].unit;
        const newUnit = sel.value;
        const baseVal = toBase(rows[i].value, oldUnit, cfg.cat);
        rows[i].value = parseFloat(fmt(fromBase(baseVal, newUnit, cfg.cat)));
        rows[i].unit = newUnit;
        App.markDirty(true);
        render();
      });
    });
    root.querySelectorAll('[data-row-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = +btn.dataset.rowRemove;
        if(rows.length>1){ rows.splice(i,1); App.markDirty(true); render(); }
      });
    });
    root.querySelector('#add-row').addEventListener('click', ()=>{
      rows.push({value:100, unit:cfg.defaultUnit});
      App.markDirty(true);
      render();
    });
    root.querySelector('#total-unit').addEventListener('change', (e)=>{
      totalUnit = e.target.value;
      compute();
    });
  }
  function compute(){
    const baseVals = rows.map(r=> toBase(r.value, r.unit, cfg.cat));
    const totalBase = cfg.combine(baseVals);
    const out = root.querySelector('#total-out');
    if(out){ out.value = fmt(fromBase(totalBase, totalUnit, cfg.cat)); flashEl(out); }
  }
  render();
  return { save(){ Store.save(cfg.storageId, {rows, totalUnit}); } };
}

CalculatorModules['epsilon-r'] = {
  render(main){
    main.innerHTML = '<div class="calc-page" id="er-body"></div>';
    this._calc = buildSimpleCalc(main.querySelector('#er-body'), {
      storageId:'epsilon-r', title:'Microstrip Effective Dielectric Constant',
      fields:[
        {key:'er', label:'Substrate εr', default:4.4},
        {key:'w', label:'Trace Width (W)', cat:'length', unit:'mm', default:0.3},
        {key:'h', label:'Dielectric Height (H)', cat:'length', unit:'mm', default:0.2},
        {key:'f', label:'Frequency (optional)', cat:'frequency', unit:'GHz', default:0},
      ],
      outputs:[
        {key:'eeff0', label:'Static εeff'},
        {key:'eefff', label:'εeff at Frequency'},
      ],
      compute:(v)=>{
        if(v.w<=0 || v.h<=0) return { eeff0:0, eefff:0 };
        const er = v.er, u = v.w/v.h;
        const eeff0 = (er+1)/2 + (er-1)/2 / Math.sqrt(1+12/u);
        const fGHz = v.f/1e9; // v.f is in Hz (base unit)
        const fn = fGHz * v.h; // GHz·mm, per Kirschning-Jansen normalisation
        if(fn<=0) return { eeff0, eefff: eeff0 };
        const P1 = 0.27488 + (0.6315 + 0.525/Math.pow(1+0.0157*fn,20))*u - 0.065683*Math.exp(-8.7513*u);
        const P2 = 0.33622*(1-Math.exp(-0.03442*er));
        const P3 = 0.0363*Math.exp(-4.6*u)*(1-Math.exp(-Math.pow(fn/38.7,4.97)));
        const P4 = 1 + 2.751*(1-Math.exp(-Math.pow(er/15.916,8)));
        const Pf = P1*P2*Math.pow((0.1844+P3*P4)*fn, 1.5763);
        const eefff = er - (er-eeff0)/(1+Pf);
        return { eeff0, eefff };
      },
      formulaHTML:`<h4>Static Formula (Hammerstad)</h4>
        <div class="formula">&epsilon;<sub>eff</sub>(0) = <span class="frac"><span class="num">&epsilon;<sub>r</sub>+1</span><span class="den">2</span></span> + <span class="frac"><span class="num">&epsilon;<sub>r</sub>&minus;1</span><span class="den">2</span></span> &middot; (1 + 12H/W)<sup>&minus;0.5</sup></div>
        <h4>Dispersion (Kirschning &amp; Jansen)</h4>
        <div class="formula">&epsilon;<sub>eff</sub>(f) = &epsilon;<sub>r</sub> &minus; <span class="frac"><span class="num">&epsilon;<sub>r</sub> &minus; &epsilon;<sub>eff</sub>(0)</span><span class="den">1 + P(f)</span></span></div>
        <p style="font-size:12px">P(f) is a 4-term empirical fit (P1..P4) in u=W/H and normalised frequency f<sub>n</sub>=f[GHz]&middot;H[mm]. Set frequency to 0 to see only the static value.</p>`,
      notesHTML:`<h4>Notes</h4><p>Static formula: most accurate for W/H &ge; 1. Dispersion model valid for 0.1&le;W/H&le;100, 1&le;&epsilon;<sub>r</sub>&le;20, accurate to about &plusmn;0.6% up to roughly 60 GHz on typical substrates. &epsilon;<sub>eff</sub> rises toward the bulk &epsilon;<sub>r</sub> as frequency increases.</p>`
    });
  },
  save(){ if(this._calc) this._calc.save(); }
};

CalculatorModules['fusing-current'] = {
  render(main){
    main.innerHTML = '<div class="calc-page" id="fc-body"></div>';
    this._calc = buildSimpleCalc(main.querySelector('#fc-body'), {
      storageId:'fusing-current', title:'Fusing Current (Onderdonk\'s Equation)',
      fields:[
        {key:'w', label:'Trace Width', cat:'length', unit:'mm', default:0.5},
        {key:'th', label:'Copper Thickness', cat:'length', unit:'µm', default:35},
        {key:'ta', label:'Ambient Temp', cat:'temperature', unit:'°C', default:25},

        {key:'s', label:'Time', cat:'time', unit:'s', default:1},

      outputs:[
        {key:'area', label:'Cross-Section Area (c.mil)'},

      ],
      compute:(v)=>{
        const wMil = v.w/0.0254, thMil = v.th/0.0254;
        const areaCMil = wMil*thMil*1.2732; // 1 sq.mil = 1.2732 circular mils

        <p style="font-size:12px">A = area in circular mils, s = time in seconds, T in &deg;C.</p>`,
      notesHTML:`<h4>Notes</h4><p>Estimates the current that raises a copper trace to its melting point (1083&deg;C for copper) within time <em>s</em>, assuming zero heat loss to conduction, convection, or radiation. Valid for short durations, generally under ~10 seconds — derate for real-world cooling and continuous operation.</p>`

const CLEARANCE_TABLE = [
  {max:15,  vals:[0.05, 0.1,  0.1,  0.05]},
  {max:30,  vals:[0.05, 0.1,  0.1,  0.05]},
  {max:50,  vals:[0.1,  0.6,  0.6,  0.13]},
  {max:100, vals:[0.1,  0.6,  1.5,  0.13]},
  {max:150, vals:[0.2,  0.6,  3.2,  0.4]},
  {max:170, vals:[0.2,  1.25, 3.2,  0.4]},
  {max:250, vals:[0.2,  1.25, 6.4,  0.4]},
  {max:300, vals:[0.2,  1.25, 12.5, 0.4]},
  {max:500, vals:[0.25, 2.5,  12.5, 0.8]},
];
const CLEARANCE_RATES = [0.0025, 0.005, 0.025, 0.00305]; // mm per volt, above 500V
const CLEARANCE_CATS = [
  {label:'B1 — Internal conductors'},
  {label:'B2 — External, uncoated, ≤3050 m altitude'},
  {label:'B3 — External, uncoated, >3050 m altitude'},
  {label:'B4 — External, permanent polymer coating'},
];
function getClearanceMM(voltage, catIdx){
  voltage = Math.abs(voltage);
  if(voltage>500) return voltage*CLEARANCE_RATES[catIdx];
  for(const row of CLEARANCE_TABLE){ if(voltage<=row.max) return row.vals[catIdx]; }
  return CLEARANCE_TABLE[CLEARANCE_TABLE.length-1].vals[catIdx];
}

        <h4>Notes</h4>

function renderViaSub(tabId, body){
  switch(tabId){
    case 'resistance':
      return buildSimpleCalc(body, {
        storageId:'via-resistance', title:'Via Barrel Resistance & Power',
        fields:[
          {key:'d', label:'Drill Diameter', cat:'length', unit:'mm', default:0.3},
          {key:'t', label:'Plating Thickness', cat:'length', unit:'µm', default:25},
          {key:'l', label:'Via Length', cat:'length', unit:'mm', default:1.6},
          {key:'i', label:'Current', cat:'current', unit:'A', default:1},
        ],
        outputs:[
          {key:'r', label:'Barrel Resistance', cat:'resistance', unit:'mΩ'},
          {key:'v', label:'Voltage Drop', cat:'voltage', unit:'mV'},
          {key:'p', label:'Power', cat:'power', unit:'mW'},
        ],
        compute:(v)=>{
          const d=v.d/1000, t=v.t/1000, l=v.l/1000; // mm -> m
          const area = Math.PI*t*(d-t); // annular barrel cross-section, m²
          const r = area>0 ? CU_RESISTIVITY*l/area : 0;
          return { r, v: v.i*r, p: v.i*v.i*r };
        },
        formulaHTML:`<h4>Formulas</h4>
          <div class="formula">A = &pi;&middot;t&middot;(d&minus;t)</div>
          <div class="formula">R = <span class="frac"><span class="num">&rho;&middot;L</span><span class="den">A</span></span></div>
          <p style="font-size:12px">d = drill diameter, t = plating thickness, L = via length, &rho; = 1.68&times;10&#8315;&sup8; &Omega;&middot;m (copper).</p>`,
        notesHTML:`<h4>Notes</h4><p>Treats the plated barrel as an annular (ring-shaped) conductor. Assumes uniform plating thickness around the hole wall.</p>`
      });
    case 'current':
      return buildSimpleCalc(body, {
        storageId:'via-current', title:'Via Current Capacity (IPC-2221)',
        fields:[
          {key:'d', label:'Drill Diameter', cat:'length', unit:'mm', default:0.3},
          {key:'t', label:'Plating Thickness', cat:'length', unit:'µm', default:25},
          {key:'dt', label:'Temp Rise (°C)', default:10},
          {key:'layer', label:'Layer', type:'select', options:LAYER_OPTS},
        ],
        outputs:[ {key:'i', label:'Max Current', cat:'current', unit:'A'} ],
        compute:(v)=>{
          const d=v.d, t=v.t/1000; // d in mm, t converted mm
          const areaMm2 = Math.PI*t*(d-t);
          const areaMil2 = areaMm2*1550.0031;
          const k = v.layer==='ext' ? 0.048 : 0.024;
          const i = areaMil2>0 ? k*Math.pow(v.dt,0.44)*Math.pow(areaMil2,0.725) : 0;
          return { i: isFinite(i)?i:0 };
        },
        formulaHTML:`<h4>Formula (IPC-2221)</h4><div class="formula">I = k &middot; &Delta;T<sup>0.44</sup> &middot; A<sup>0.725</sup></div>
          <p style="font-size:12px">A = via barrel annular area in mil&sup2;. k = 0.048 external, 0.024 internal.</p>`,
        notesHTML:`<h4>Notes</h4><p>Applies the standard IPC-2221 trace-current curve-fit to the via's barrel cross-section — a common approximation, since IPC-2221 doesn't define a via-specific formula. Treat as a conservative estimate; IPC-2152 or thermal simulation gives more accurate results for critical designs.</p>`
      });
    case 'inductance':
      return buildSimpleCalc(body, {
        storageId:'via-inductance', title:'Via Inductance',
        fields:[
          {key:'h', label:'Via Length', cat:'length', unit:'mm', default:1.6},
          {key:'d', label:'Via Diameter', cat:'length', unit:'mm', default:0.3},
        ],
        outputs:[ {key:'l', label:'Inductance', cat:'inductance', unit:'nH'} ],
        compute:(v)=>{
          const hIn=v.h/25.4, dIn=v.d/25.4;
          const lnH = dIn>0 ? 5.08*hIn*(Math.log(4*hIn/dIn)+1) : 0;
          return { l: lnH*1e-9 }; // nH -> H (base inductance unit)
        },
        formulaHTML:`<h4>Formula (Johnson &amp; Graham)</h4><div class="formula">L = 5.08&middot;h&middot;[ln(4h/d) + 1]&nbsp;nH</div>
          <p style="font-size:12px">h, d in inches.</p>`,
        notesHTML:`<h4>Notes</h4><p>From Johnson &amp; Graham, <em>High-Speed Digital Design</em>. Length dominates — diameter sits inside the log term and has a much smaller effect.</p>`
      });
    case 'capacitance':
      return buildSimpleCalc(body, {
        storageId:'via-capacitance', title:'Via Pad/Antipad Capacitance',
        fields:[
          {key:'d1', label:'Pad Diameter (D1)', cat:'length', unit:'mm', default:0.6},
          {key:'d2', label:'Antipad Diameter (D2)', cat:'length', unit:'mm', default:1.0},
          {key:'th', label:'Board Thickness (T)', cat:'length', unit:'mm', default:1.6},
          {key:'er', label:'Substrate εr', default:4.4},
        ],
        outputs:[ {key:'c', label:'Capacitance', cat:'capacitance', unit:'pF'} ],
        compute:(v)=>{
          const d1=v.d1/25.4, d2=v.d2/25.4, th=v.th/25.4; // mm -> in
          const cpF = (d2>d1) ? 1.41*v.er*th*d1/(d2-d1) : 0;
          return { c: cpF*1e-12 }; // pF -> F (base capacitance unit)
        },
        formulaHTML:`<h4>Formula (Johnson &amp; Graham)</h4><div class="formula">C(pF) = <span class="frac"><span class="num">1.41&middot;&epsilon;<sub>r</sub>&middot;T&middot;D1</span><span class="den">D2 &minus; D1</span></span></div>
          <p style="font-size:12px">D1, D2, T in inches.</p>`,
        notesHTML:`<h4>Notes</h4><p>Parasitic capacitance from the via's pad to the surrounding plane, through the antipad clearance. Larger antipads reduce this capacitance.</p>`
      });
  }
}

function renderTraceSub(tabId, body){
  switch(tabId){
    case 'current':
      return buildSimpleCalc(body, {
        storageId:'trace-current', title:'Max Current from Width',
        fields:[
          {key:'w', label:'Trace Width', cat:'length', unit:'mm', default:0.5},
          {key:'th', label:'Copper Thickness', cat:'length', unit:'µm', default:35},
          {key:'len', label:'Trace Length', cat:'length', unit:'mm', default:100},
          {key:'dt', label:'Temp Rise (°C)', default:10},
          {key:'layer', label:'Layer', type:'select', options:LAYER_OPTS},
        ],
        outputs:[
          {key:'i', label:'Max Current', cat:'current', unit:'A'},
          {key:'vdrop', label:'Voltage Drop @ Imax', cat:'voltage', unit:'mV'},
        ],
        compute:(v)=>{
          const wMil=v.w/0.0254, thMil=v.th/0.0254;
          const area = wMil*thMil;
          const k = v.layer==='ext' ? 0.048 : 0.024;
          const i = k*Math.pow(v.dt,0.44)*Math.pow(area,0.725);
          const areaM2 = (v.w/1000)*(v.th/1000); // mm -> m
          const r = areaM2>0 ? CU_RESISTIVITY*(v.len/1000)/areaM2 : 0;
          return { i, vdrop: i*r };
        },
        formulaHTML:`<h4>Formula (IPC-2221)</h4><div class="formula">I = k &middot; &Delta;T<sup>0.44</sup> &middot; (W&middot;H)<sup>0.725</sup></div>
          <p style="font-size:12px">W, H in mils. k = 0.048 external, 0.024 internal.</p>
          <h4>Voltage Drop</h4><div class="formula">V = I<sub>max</sub> &middot; &rho;&middot;L / (W&middot;H)</div>
          <p style="font-size:12px">&rho; = 1.68&times;10&#8315;&sup8; &Omega;&middot;m (copper). Assumes uniform width/thickness over the full length.</p>`,
        notesHTML:`<h4>Notes</h4><p>Classic IPC-2221 curve-fit (still air, no adjacent plane heat-sinking). Conservative vs. the newer IPC-2152 model — real boards can often run cooler/narrower.</p>
          <p>Voltage drop is the drop over the given length carrying the calculated max current — not a temperature-related quantity.</p>`
      });
    case 'width':
      return buildSimpleCalc(body, {
        storageId:'trace-width-req', title:'Required Width from Current',
        fields:[
          {key:'i', label:'Current', cat:'current', unit:'A', default:2},
          {key:'th', label:'Copper Thickness', cat:'length', unit:'µm', default:35},
          {key:'len', label:'Trace Length', cat:'length', unit:'mm', default:100},
          {key:'dt', label:'Temp Rise (°C)', default:10},
          {key:'layer', label:'Layer', type:'select', options:LAYER_OPTS},
        ],
        outputs:[
          {key:'w', label:'Required Width', cat:'length', unit:'mm'},
          {key:'vdrop', label:'Voltage Drop @ I', cat:'voltage', unit:'mV'},
        ],
        compute:(v)=>{
          const k = v.layer==='ext' ? 0.048 : 0.024;
          const areaMil2 = Math.pow(v.i/(k*Math.pow(v.dt,0.44)), 1/0.725);
          const thMil = v.th/0.0254;
          const wMil = thMil>0 ? areaMil2/thMil : 0;
          const wMm = wMil*0.0254;
          const areaM2 = (wMm/1000)*(v.th/1000);
          const r = areaM2>0 ? CU_RESISTIVITY*(v.len/1000)/areaM2 : 0;
          return { w: wMm, vdrop: v.i*r };
        },
        formulaHTML:`<h4>Formula (IPC-2221)</h4><div class="formula">A = <span class="frac"><span class="num">I</span><span class="den">k&middot;&Delta;T<sup>0.44</sup></span></span><sup>1/0.725</sup>, &nbsp; W = A / H</div>
          <h4>Voltage Drop</h4><div class="formula">V = I &middot; &rho;&middot;L / (W&middot;H)</div>
          <p style="font-size:12px">Uses the solved width above. &rho; = 1.68&times;10&#8315;&sup8; &Omega;&middot;m (copper).</p>`,
        notesHTML:`<h4>Notes</h4><p>Solves the same IPC-2221 relation for the minimum width that keeps the trace within the target temperature rise at the given current.</p>
          <p>Voltage drop follows from that width over the given length — check it against your supply's tolerance budget.</p>`
      });
    case 'temprise':
      return buildSimpleCalc(body, {
        storageId:'trace-temprise', title:'Temperature Rise from Width & Current',
        fields:[
          {key:'w', label:'Trace Width', cat:'length', unit:'mm', default:0.5},
          {key:'th', label:'Copper Thickness', cat:'length', unit:'µm', default:35},
          {key:'i', label:'Current', cat:'current', unit:'A', default:2},
          {key:'layer', label:'Layer', type:'select', options:LAYER_OPTS},
        ],
        outputs:[ {key:'dt', label:'Temp Rise (°C)'} ],
        compute:(v)=>{
          const wMil=v.w/0.0254, thMil=v.th/0.0254;
          const area = wMil*thMil;
          const k = v.layer==='ext' ? 0.048 : 0.024;
          const dt = area>0 ? Math.pow(v.i/(k*Math.pow(area,0.725)), 1/0.44) : 0;
          return { dt: isFinite(dt)?dt:0 };
        },
        formulaHTML:`<h4>Formula (IPC-2221)</h4><div class="formula">&Delta;T = <span class="frac"><span class="num">I</span><span class="den">k&middot;A<sup>0.725</sup></span></span><sup>1/0.44</sup></div>`,
        notesHTML:`<h4>Notes</h4><p>Estimates steady-state temperature rise above ambient for a trace of this width/thickness carrying this current.</p>`
      });
  }
}

const RF_FIELDS = [
  {key:'vswr', label:'VSWR', decimals:4,
    toGamma:v=> v>=1 ? (v-1)/(v+1) : 0,
    fromGamma:g=> g<1 ? (1+g)/(1-g) : Infinity},
  {key:'gamma', label:'Reflection Coefficient |Γ|', decimals:4,
    toGamma:v=> Math.min(Math.max(v,0),0.999999),
    fromGamma:g=> g},
  {key:'rl', label:'Return Loss (dB)', decimals:3,
    toGamma:v=> Math.pow(10,-v/20),
    fromGamma:g=> g>0 ? -20*Math.log10(g) : Infinity},
  {key:'ml', label:'Mismatch Loss (dB)', decimals:4,
    toGamma:v=> Math.sqrt(Math.max(1-Math.pow(10,-v/10),0)),
    fromGamma:g=> -10*Math.log10(Math.max(1-g*g,1e-15))},
  {key:'refl', label:'Reflected Power (%)', decimals:3,
    toGamma:v=> Math.sqrt(Math.max(v,0)/100),
    fromGamma:g=> g*g*100},
  {key:'through', label:'Through Power (%)', decimals:3,
    toGamma:v=> Math.sqrt(Math.max(1-v/100,0)),
    fromGamma:g=> (1-g*g)*100},
];
function renderRFSub(body){
  const saved = Store.load('rf-vswr');
  let gamma = (saved && typeof saved.gamma==='number') ? saved.gamma : RF_FIELDS[0].toGamma(2);
  const rows = RF_FIELDS.map(f=>`<div class="field-row">
    <div class="field-label">${f.label}</div>
    <input class="field-input" data-rf="${f.key}" type="text" inputmode="decimal">
    <div class="scrub"></div>
  </div>`).join('');
  body.innerHTML = `<div class="calc-page"><div class="calc-columns">
    <div class="panel"><h3>VSWR &harr; Reflection / Loss / Power</h3>${rows}</div>
    <div class="panel side-panel">
      <h4>Formulas</h4>
      <div class="formula">VSWR = <span class="frac"><span class="num">1+|&Gamma;|</span><span class="den">1&minus;|&Gamma;|</span></span></div>
      <div class="formula">RL(dB) = &minus;20&middot;log<sub>10</sub>|&Gamma;|</div>
      <div class="formula">ML(dB) = &minus;10&middot;log<sub>10</sub>(1&minus;|&Gamma;|<sup>2</sup>)</div>
      <div class="formula">P<sub>refl</sub> = |&Gamma;|<sup>2</sup>&middot;100%, &nbsp; P<sub>thru</sub> = (1&minus;|&Gamma;|<sup>2</sup>)&middot;100%</div>
      <h4>Notes</h4>
      <p>All six describe one impedance mismatch through a shared |&Gamma;|. Edit any field — the rest update instantly.</p>
      <p>A perfect match (|&Gamma;|=0) gives infinite return loss and 0% reflected power; total mismatch (|&Gamma;|=1) gives VSWR = &infin;.</p>
    </div>
  </div></div>`;
  function paint(skip){
    RF_FIELDS.forEach(f=>{
      if(f.key===skip) return;
      const el = body.querySelector('[data-rf="'+f.key+'"]');
      const val = f.fromGamma(gamma);
      el.value = isFinite(val) ? fmt(parseFloat(val.toFixed(f.decimals))) : '∞';
      flashEl(el);
    });
  }
  RF_FIELDS.forEach(f=>{
    const el = body.querySelector('[data-rf="'+f.key+'"]');
    el.addEventListener('input', ()=>{
      const raw = parseFloat(el.value);
      if(isNaN(raw)) return;
      gamma = Math.min(Math.max(f.toGamma(raw),0),0.999999);
      App.markDirty(true);
      paint(f.key);
    });
  });
  wireScrubs(body);
  paint(null);
  return { save(){ Store.save('rf-vswr', {gamma}); } };
}

/* ---------- Transmission Line Impedance ---------- */
function ellipK(k){ // complete elliptic integral of 1st kind via AGM
  let a=1, b=Math.sqrt(1-k*k);
  for(let i=0;i<24;i++){ const t=(a+b)/2; b=Math.sqrt(a*b); a=t; }
  return Math.PI/(2*a);
}
function microstripZ(w,h,er){ // Hammerstad-Jensen
  const u=w/h, ee=(er+1)/2+(er-1)/2/Math.sqrt(1+12/u);
  const F1=6+(2*Math.PI-6)*Math.exp(-Math.pow(30.666/u,0.7528));
  return { z:60/Math.sqrt(ee)*Math.log(F1/u+Math.sqrt(1+4/(u*u))), ee };
}
function striplineZ(w,t,b,er){ // IPC-2141
  const x=4*b/(0.67*Math.PI*(0.8*w+t));
  return x>1 ? 60/Math.sqrt(er)*Math.log(x) : 0;
}
function cpwgZ(w,s,h,er){ // conductor-backed CPW (Simons)
  const a=w/2, b=w/2+s, k=a/b;
  const k1=Math.tanh(Math.PI*a/(2*h))/Math.tanh(Math.PI*b/(2*h));
  const kp=Math.sqrt(1-k*k), k1p=Math.sqrt(1-k1*k1);
  const r=ellipK(k)/ellipK(kp), r1=ellipK(k1)/ellipK(k1p), q=r1/r;
  const ee=(1+er*q)/(1+q);
  return { z:60*Math.PI/Math.sqrt(ee)/(r+r1), ee };
}
const LEN = (key,label,def,unit,round)=>({key, label, cat:'length', unit:unit||'mm', default:def, round});
const ER = {key:'er', label:'Substrate εr', default:4.4};
const OUT_Z = (key,label,ed)=>({key, label, cat:'resistance', unit:'Ω', editable:!!ed});
// Find trace width W (mm) so that zFn(W) = target. Z falls monotonically as W grows; bisect on a log scale around ref.
function solveW(zFn, target, ref){
  if(!(target>0) || !(ref>0)) return 0;
  let lo=ref*1e-4, hi=ref*1e3;
  for(let i=0;i<80;i++){
    const mid=Math.sqrt(lo*hi);
    if(zFn(mid) > target) lo=mid; else hi=mid;
  }
  return Math.sqrt(lo*hi);
}
const F_MS = `<h4>Formula (Hammerstad&ndash;Jensen)</h4>
  <div class="formula">Z<sub>0</sub> = <span class="frac"><span class="num">60</span><span class="den">&radic;&epsilon;<sub>eff</sub></span></span> &middot; ln(F<sub>1</sub>H/W + &radic;(1+(2H/W)<sup>2</sup>))</div>
  <div class="formula">F<sub>1</sub> = 6 + (2&pi;&minus;6)&middot;e<sup>&minus;(30.666H/W)<sup>0.7528</sup></sup></div>`;
const F_SL = `<h4>Formula (IPC-2141)</h4>
  <div class="formula">Z<sub>0</sub> = <span class="frac"><span class="num">60</span><span class="den">&radic;&epsilon;<sub>r</sub></span></span> &middot; ln<span>(</span><span class="frac"><span class="num">4b</span><span class="den">0.67&pi;(0.8W+T)</span></span><span>)</span></div>
  <p style="font-size:12px">b = plane-to-plane spacing. Valid for W/b &lt; 0.35, T/b &lt; 0.25.</p>`;

CalculatorModules['transmission-line'] = {
  render(main){
    this._calc = buildTabbedCalculator(main, [

    ], (id, body)=> buildTabbedCalculator(body,
      id==='single'
        ? [{id:'ms',label:'Microstrip'},{id:'sl',label:'Stripline'},{id:'cpwg',label:'Coplanar (grounded)'}]
        : [{id:'ms',label:'Edge-Coupled Microstrip'},{id:'sl',label:'Edge-Coupled Stripline'},{id:'cpwg',label:'Edge-Coupled Coplanar (grounded)'}],

function renderTLine(cat, type, body){
  const key = 'tl-'+cat+'-'+type;
  if(cat==='single' && type==='ms') return buildSimpleCalc(body, {
    storageId:key, title:'Microstrip Impedance',
    fields:[ER, LEN('w','Trace Width (W)',0.3,null,{mm:2,mil:0}), LEN('h','Dielectric Height (H)',0.2)],
    outputs:[OUT_Z('z','Z0',true), {key:'ee', label:'εeff'}],
    compute:v=>{ if(v.w<=0||v.h<=0) return {z:0,ee:0}; const r=microstripZ(v.w,v.h,v.er); return {z:r.z, ee:r.ee}; },
    inverse:{ z:(b,target)=>({ w: solveW(w=>microstripZ(w,b.h,b.er).z, target, b.h) }) },
    formulaHTML:F_MS,
    notesHTML:`<h4>Notes</h4><p>Surface trace over one plane. Copper thickness is ignored; accurate to ~1% for 0.05 &lt; W/H &lt; 20.</p>`
  });
  if(cat==='single' && type==='sl') return buildSimpleCalc(body, {
    storageId:key, title:'Symmetric Stripline Impedance',
    fields:[ER, LEN('w','Trace Width (W)',0.15,null,{mm:2,mil:0}), LEN('t','Copper Thickness (T)',35,'µm'), LEN('b','Plane Spacing (b)',0.4)],
    outputs:[OUT_Z('z','Z0',true)],
    compute:v=>({z:striplineZ(v.w,v.t,v.b,v.er)}),
    inverse:{ z:(b,target)=>({ w: solveW(w=>striplineZ(w,b.t,b.b,b.er), target, b.b) }) },
    formulaHTML:F_SL,
    notesHTML:`<h4>Notes</h4><p>Trace centred between two planes. Outputs 0 if the geometry is outside the formula's range.</p>`
  });
  if(cat==='single' && type==='cpwg') return buildSimpleCalc(body, {
    storageId:key, title:'Grounded Coplanar Waveguide Impedance',
    fields:[ER, LEN('w','Trace Width (W)',0.3,null,{mm:2,mil:0}), LEN('s','Gap to Coplanar Ground (S)',0.2), LEN('h','Dielectric Height (H)',0.2)],
    outputs:[OUT_Z('z','Z0',true), {key:'ee', label:'εeff'}],
    compute:v=>{ if(v.w<=0||v.s<=0||v.h<=0) return {z:0,ee:0}; const r=cpwgZ(v.w,v.s,v.h,v.er); return {z:r.z, ee:r.ee}; },
    inverse:{ z:(b,target)=>({ w: solveW(w=>cpwgZ(w,b.s,b.h,b.er).z, target, b.h) }) },
    formulaHTML:`<h4>Formula (Simons)</h4>
      <div class="formula">Z<sub>0</sub> = <span class="frac"><span class="num">60&pi;</span><span class="den">&radic;&epsilon;<sub>eff</sub></span></span> &middot; <span class="frac"><span class="num">1</span><span class="den">K(k)/K(k&prime;) + K(k<sub>1</sub>)/K(k<sub>1</sub>&prime;)</span></span></div>
      <div class="formula">&epsilon;<sub>eff</sub> = <span class="frac"><span class="num">1 + &epsilon;<sub>r</sub>&middot;q</span><span class="den">1 + q</span></span>, &nbsp; q = <span class="frac"><span class="num">K(k&prime;)K(k<sub>1</sub>)</span><span class="den">K(k)K(k<sub>1</sub>&prime;)</span></span></div>
      <p style="font-size:12px">k = a/b, k<sub>1</sub> = tanh(&pi;a/2H)/tanh(&pi;b/2H), a = W/2, b = W/2+S. K = complete elliptic integral.</p>`,

  });
  if(cat==='diff' && type==='ms') return buildSimpleCalc(body, {
    storageId:key, title:'Edge-Coupled Microstrip (Differential)',
    fields:[ER, LEN('w','Trace Width (W)',0.3), LEN('h','Dielectric Height (H)',0.2), LEN('s','Trace Spacing (S)',0.2)],
    outputs:[OUT_Z('zd','Z diff'), OUT_Z('z','Z0 single-ended')],
    compute:v=>{ if(v.w<=0||v.h<=0) return {zd:0,z:0}; const z=microstripZ(v.w,v.h,v.er).z; return {z, zd:2*z*(1-0.48*Math.exp(-0.96*v.s/v.h))}; },
    formulaHTML:`<h4>Formula (IPC-2141)</h4><div class="formula">Z<sub>diff</sub> = 2&middot;Z<sub>0</sub>&middot;(1 &minus; 0.48&middot;e<sup>&minus;0.96&middot;S/H</sup>)</div><p style="font-size:12px">Z<sub>0</sub>: single-ended microstrip (Hammerstad&ndash;Jensen).</p>`,
    notesHTML:`<h4>Notes</h4><p>Approximation for loosely to moderately coupled pairs. Use a field solver for final tight-tolerance designs.</p>`
  });
  if(cat==='diff' && type==='sl') return buildSimpleCalc(body, {
    storageId:key, title:'Edge-Coupled Stripline (Differential)',

    formulaHTML:`<h4>Formula (IPC-2141)</h4><div class="formula">Z<sub>diff</sub> = 2&middot;Z<sub>0</sub>&middot;(1 &minus; 0.347&middot;e<sup>&minus;2.9&middot;S/b</sup>)</div>`,
    notesHTML:`<h4>Notes</h4><p>Pair centred between two planes. Z<sub>0</sub> from the single-ended stripline formula.</p>`
  });
  return buildSimpleCalc(body, {
    storageId:key, title:'Edge-Coupled Coplanar, Grounded (Differential)',
    fields:[ER, LEN('w','Trace Width (W)',0.3), LEN('gp','Gap to Coplanar Ground (Gp)',0.2), LEN('h','Dielectric Height (H)',0.2), LEN('s','Trace Spacing (S)',0.2)],
    outputs:[OUT_Z('zd','Z diff'), OUT_Z('z','Z0 single-ended')],
    compute:v=>{ if(v.w<=0||v.gp<=0||v.h<=0) return {zd:0,z:0}; const z=cpwgZ(v.w,v.gp,v.h,v.er).z; return {z, zd:2*z*(1-0.48*Math.exp(-0.96*v.s/v.h))}; },
    formulaHTML:`<h4>Formula (IPC-2141-style)</h4><div class="formula">Z<sub>diff</sub> = 2&middot;Z<sub>0</sub>&middot;(1 &minus; 0.48&middot;e<sup>&minus;0.96&middot;S/H</sup>)</div><p style="font-size:12px">Z<sub>0</sub>: single-ended grounded CPW (Simons).</p>`,
    notesHTML:`<h4>Notes</h4><p>Applies the same coupling correction used for differential microstrip to a CPWG pair — a practical approximation, not a closed-form coupled-CPW solution. Use a field solver (or odd-mode elliptic-integral analysis) for tight-tolerance designs.</p>`
  });
}

};
const E_OPTS = Object.keys(E_SERIES).map(v=>({value:v, label:v}));
function eValues(series, dLo, dHi){ // all series values across decades 10^dLo .. 10^dHi
  const out = [];
  for(let d=dLo; d<=dHi; d++){ const p=Math.pow(10,d); for(const m of E_SERIES[series]) out.push(m*p); }
  return out;
}
function eNearest(t, series){
  let lo=0, hi=Infinity;
  const e = Math.floor(Math.log10(t));
  for(const v of eValues(series, e-1, e+1)){
    if(v<=t*(1+1e-9) && v>lo) lo=v;
    if(v>=t*(1-1e-9) && v<hi) hi=v;
  }
  return { lo, hi, near: (t-lo <= hi-t) ? lo : hi };
}
const BALANCE_WEIGHT = 2.5; // Optimum mode: equivalent error-% cost per decade of R1:R2 imbalance
function eCombo(t, series, weight){
  weight = weight || 0;
  const e = Math.floor(Math.log10(t));
  const sv = eValues(series, e-2, e), pv = eValues(series, e, e+2);
  function search(vals, isSeries){
    let best = {score:Infinity, a:0, b:0, r:0};
    for(let i=0;i<vals.length;i++) for(let j=i;j<vals.length;j++){
      const r = isSeries ? vals[i]+vals[j] : (vals[i]*vals[j])/(vals[i]+vals[j]);
      const errPct = Math.abs(r-t)/t*100;
      const decades = Math.log10(vals[j]/vals[i]); // vals sorted ascending, j>=i, so >=0
      const score = errPct + weight*decades;
      if(score<best.score) best = {score, a:vals[i], b:vals[j], r};
    }
    return best;
  }
  return { bs: search(sv, true), bp: search(pv, false) };
}

  const state = {
    target: saved.target || { value:2.35, unit:'kΩ' },
    series: saved.series || 'E24',
    mode: saved.mode || 'optimum',

    let s = {a:0,b:0,r:0,e:0,valid:false}, p = {a:0,b:0,r:0,e:0,valid:false};
    if(t>0){
      const weight = state.mode==='precise' ? 0 : BALANCE_WEIGHT;
      const {bs,bp} = eCombo(t, state.series, weight);
      if(state.lockS){
        if(!state.sLockedR1) state.sLockedR1 = { value: parseFloat(fmt(fromBase(bs.a,'kΩ','resistance'))), unit:'kΩ' };
        const r1 = toBase(state.sLockedR1.value, state.sLockedR1.unit, 'resistance');
        const r2ideal = t - r1;
        if(r2ideal>0){ const r2=eNearest(r2ideal, state.series).near; const r=r1+r2; s={a:r1,b:r2,r,e:(r-t)/t*100,valid:true}; }

      } else {

      if(state.lockP){

/* ---------- Capacitor code decoder ---------- */
const CAP_TOL = {B:'±0.1 pF', C:'±0.25 pF', D:'±0.5 pF', F:'±1%', G:'±2%', J:'±5%', K:'±10%', M:'±20%', Z:'+80% / −20%'};
function decodeCap(raw){
  let s = raw.trim().toUpperCase(), tol = '—', m;
  if(s.length>1 && CAP_TOL[s.slice(-1)] && /\d/.test(s.slice(-2,-1))){ tol = CAP_TOL[s.slice(-1)]; s = s.slice(0,-1); }
  let pF = NaN;
  if(/^\d{3}$/.test(s)){ const d=+s[2]; pF = +s.slice(0,2) * (d===8 ? 0.01 : d===9 ? 0.1 : Math.pow(10,d)); }
  else if(/^\d{1,2}$/.test(s)) pF = +s;
  else if((m = s.match(/^(\d*)([RPNU])(\d*)$/)) && (m[1]||m[3])) pF = parseFloat((m[1]||'0')+'.'+(m[3]||'0')) * {R:1,P:1,N:1e3,U:1e6}[m[2]];
  return { pF, tol };
}
function encodeCap(pF){
  if(!(pF>0)) return '—';
  if(pF<10) return pF.toFixed(1).replace('.','R');
  let e = Math.floor(Math.log10(pF))-1, mant = Math.round(pF/Math.pow(10,e));
  if(mant>=100){ mant = Math.round(mant/10); e++; }
  return e>7 ? '—' : `${mant}${e}`;
}

      </div>` : ''}

function skFacetGroup(title, dim, values, labelFn, f){
  const opts = values.map(v=>{
    const count = skCount(dim, v, f);
    const checked = f[dim].has(v);
    const disabled = count===0 && !checked;
    return `<label class="sk-filter-opt ${disabled?'disabled':''}">
      <input type="checkbox" data-dim="${dim}" data-val="${v}" ${checked?'checked':''} ${disabled?'disabled':''}>
      <span>${labelFn(v)}</span><span class="sk-count">${count}</span>
    </label>`;
  }).join('');
  return `<div class="sk-filter-group"><h4>${title}</h4>${opts}</div>`;
}
let _skBuilderRerender = null;
function refreshStackupBuilder(){

}
function renderStackupBuilder(body){
  const f = { layers:new Set(), substrate:new Set(), price:new Set() };
  function render(){
    const results = allStackups().filter(s=>skMatches(s,f));
    const anyActive = f.layers.size || f.substrate.size || f.price.size;
    body.innerHTML = `<div class="sk-filter-layout">
      <div class="sk-filter-panel">
        <button class="sk-btn sk-btn-primary" id="sk-new" style="width:100%;margin-bottom:14px">+ New Stackup</button>

          <span><i style="background:${SK_COLORS.mask}"></i>Mask</span>
          <span><i style="background:${SK_COLORS.copper}"></i>Copper</span>
          <span><i style="background:${SK_COLORS.core}"></i>Core</span>
          <span><i style="background:${SK_COLORS.prepreg}"></i>Prepreg</span>
        </div>
        ${skFacetGroup('Layer Count', 'layers', SK_LAYER_COUNTS, v=>v+' layers', f)}
        ${skFacetGroup('Substrate', 'substrate', substrateOptions(), v=>v, f)}
        ${skFacetGroup('Price', 'price', SK_PRICES.map(p=>p.v), v=>SK_PRICES.find(p=>p.v===v).l, f)}
        ${anyActive ? '<button class="add-row-btn" id="sk-clear">Clear filters</button>' : ''}
        <p style="font-size:11.5px;color:var(--text-dim);margin-top:12px">Checking multiple values in one group broadens that group (OR). Groups combine (AND). Grayed options would return zero results.</p>
      </div>
      <div class="sk-results-panel">
        ${results.length ? results.map(skCard).join('') : '<p class="placeholder" style="padding:30px 0">No stackups match these filters.</p>'}
      </div>
    </div>`;
    body.querySelector('#sk-new').addEventListener('click', ()=> openStackupEditor(null));
    body.querySelectorAll('[data-dim]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const dim = cb.dataset.dim, raw = cb.dataset.val;
        const val = dim==='layers' ? +raw : raw;
        if(cb.checked) f[dim].add(val); else f[dim].delete(val);
        render();
      });
    });
    body.querySelectorAll('.sk-card').forEach(card=>{
      card.addEventListener('click', ()=> openStackupInfo(allStackups().find(s=>s.id===card.dataset.skId)));
    });
    const clearBtn = body.querySelector('#sk-clear');
    if(clearBtn) clearBtn.addEventListener('click', ()=>{ f.layers.clear(); f.substrate.clear(); f.price.clear(); render(); });
  }
  _skBuilderRerender = render;
  render();
  return {};
}
