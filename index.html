const SK_CU_WEIGHTS = [0.5,1,2,3];
const SK_CU_WEIGHT_MM = {0.5:0.0175, 1:0.035, 2:0.07, 3:0.105};
function skNewLayer(type){
  if(type==='copper') return { type:'copper', role:'signal', weightOz:1, custom:false, tValue:35, tUnit:'µm', material:'' };
  return { type, role:null, weightOz:null, custom:true, tValue: type==='core'?1.6:0.2, tUnit:'mm', material:'FR4' };
}
function skLayerMm(l){
  if(l.type==='copper' && !l.custom) return SK_CU_WEIGHT_MM[l.weightOz];
  return toBase(l.tValue, l.tUnit, 'length');
}
function skLayerLabel(l){
  if(l.type==='copper'){
    const w = l.custom ? fmt(l.tValue)+l.tUnit : l.weightOz+'oz';
    return `${w} Cu${l.role? ' ('+(l.role==='signal'?'Signal':'Plane')+')' : ''}`;
  }
  const mat = l.material ? l.material+' ' : '';
  return `${mat}${l.type==='core'?'Core':'Prepreg'} \u00b7 ${fmt(l.tValue)}${l.tUnit}`;
}
let skbDraft = null;
function openStackupEditor(existing){
  skbDraft = existing
    ? { id:existing.id, name:existing.name, substrate:existing.substrate, price:existing.price,
        layers: existing.stack.map(l=> l._raw ? Object.assign({}, l._raw) : Object.assign(skNewLayer(l.type), {tValue:l.t, tUnit:'mm', custom:true})),
        imp: existing.imp ? JSON.parse(JSON.stringify(existing.imp)) : {} }
    : { id:null, name:'My Stackup', substrate:'FR4', price:'cheap',
        layers:[ skNewLayer('copper'), skNewLayer('core'), skNewLayer('copper') ], imp:{} };
  renderStackupEditor();
  document.getElementById('stackup-editor-overlay').classList.remove('hidden');
}
function closeStackupEditor(){ document.getElementById('stackup-editor-overlay').classList.add('hidden'); }
function renderStackupEditor(){
  const body = document.getElementById('skb-body');
  document.getElementById('skb-title').textContent = skbDraft.id ? 'Edit Stackup' : 'New Stackup';
  const lenUnitOpts = sel => Object.keys(UNIT_DEFS.length.units).map(u=>`<option ${u===sel?'selected':''}>${u}</option>`).join('');
  const layerRows = skbDraft.layers.map((l,i)=>{
    const typeOpts = ['copper','core','prepreg'].map(t=>`<option value="${t}" ${t===l.type?'selected':''}>${t==='copper'?'Copper':t==='core'?'Core':'Prepreg'}</option>`).join('');
    let sub = '';
    if(l.type==='copper'){
      const roleOpts = ['signal','plane'].map(r=>`<option value="${r}" ${r===l.role?'selected':''}>${r==='signal'?'Signal':'Plane'}</option>`).join('');
      const weightOpts = SK_CU_WEIGHTS.map(w=>`<option value="${w}" ${!l.custom && w===l.weightOz?'selected':''}>${w}oz</option>`).join('') + `<option value="custom" ${l.custom?'selected':''}>Custom</option>`;
      sub = `<select class="field-input" data-li="${i}" data-f="role" style="max-width:90px">${roleOpts}</select>
        <select class="field-input" data-li="${i}" data-f="weight" style="max-width:90px">${weightOpts}</select>
        ${l.custom ? `<input class="field-input" data-li="${i}" data-f="tValue" type="number" step="any" value="${l.tValue}" style="max-width:70px">
          <select class="field-unit" data-li="${i}" data-f="tUnit">${lenUnitOpts(l.tUnit)}</select>` : ''}`;
    } else {
      sub = `<input class="field-input" data-li="${i}" data-f="material" type="text" placeholder="Material" value="${l.material||''}" style="max-width:110px">
        <input class="field-input" data-li="${i}" data-f="tValue" type="number" step="any" value="${l.tValue}" style="max-width:70px">
        <select class="field-unit" data-li="${i}" data-f="tUnit">${lenUnitOpts(l.tUnit)}</select>`;
    }
    return `<div class="sk-layer-row">
      <span class="sk-layer-num">${i+1}</span>
      <select class="field-input" data-li="${i}" data-f="type" style="max-width:100px">${typeOpts}</select>
      ${sub}
      <button class="icon-btn" data-act="up" data-li="${i}" title="Move up" ${i===0?'disabled':''}>&uarr;</button>
      <button class="icon-btn" data-act="down" data-li="${i}" title="Move down" ${i===skbDraft.layers.length-1?'disabled':''}>&darr;</button>
      <button class="field-remove" data-act="remove" data-li="${i}" title="Remove">&times;</button>
    </div>`;
  }).join('');
  const cuCount = skbDraft.layers.filter(l=>l.type==='copper').length;
  const impRows = SK_IMPEDANCE_TARGETS.map(t=>{
    const v = skbDraft.imp[t.id] || {};
    return `<div class="field-row">
      <div class="field-label" style="width:190px">${t.label}</div>
      <input class="field-input" data-imp="${t.id}" data-f="w" type="text" placeholder="Width (e.g. 13 mil)" value="${v.w||''}">
      <input class="field-input" data-imp="${t.id}" data-f="clearance" type="text" placeholder="Clearance (e.g. 7 mil)" value="${v.clearance||''}">
    </div>`;
  }).join('');
  body.innerHTML = `
    <div class="field-row"><div class="field-label">Name</div><input class="field-input" id="skb-name" type="text" value="${skbDraft.name}"></div>
    <div class="field-row"><div class="field-label">Substrate</div>
      <input class="field-input" id="skb-substrate" type="text" list="skb-substrate-list" value="${skbDraft.substrate}">
      <datalist id="skb-substrate-list">${substrateOptions().map(s=>`<option value="${s}">`).join('')}</datalist>
    </div>
    <div class="field-row"><div class="field-label">Price Tier</div>
      <select class="field-input" id="skb-price">
        <option value="cheap" ${skbDraft.price==='cheap'?'selected':''}>Cheap</option>
        <option value="expensive" ${skbDraft.price==='expensive'?'selected':''}>Expensive</option>
      </select>
    </div>
    <hr class="sep">
    <h4 style="margin:0 0 8px">Layers, top to bottom &middot; ${cuCount} copper layer${cuCount===1?'':'s'}${cuCount%2?' <span style="color:var(--danger)">(should be even)</span>':''}</h4>
    <div id="skb-layers">${layerRows}</div>
    <button class="add-row-btn" id="skb-add-layer">+ Add Layer</button>
    <hr class="sep">
    <h4 style="margin:0 0 8px">Recommended Width / Clearance (optional)</h4>
    ${impRows}
    <hr class="sep">
    <div style="display:flex;gap:8px;justify-content:flex-end">
      ${skbDraft.id ? '<button class="sk-btn sk-btn-danger" id="skb-delete" style="margin-right:auto">Delete</button>' : ''}
      <button class="sk-btn sk-btn-plain" id="skb-cancel">Cancel</button>
      <button class="sk-btn sk-btn-primary" id="skb-save">Save Stackup</button>
    </div>`;
  body.querySelectorAll('[data-li]').forEach(el=>{
    const i = +el.dataset.li, fld = el.dataset.f;
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const l = skbDraft.layers[i];
      if(fld==='type'){ skbDraft.layers[i] = skNewLayer(el.value); renderStackupEditor(); return; }
      if(fld==='role') l.role = el.value;
      else if(fld==='weight'){
        if(el.value==='custom') l.custom = true; else { l.custom = false; l.weightOz = +el.value; }
        renderStackupEditor(); return;
      }
      else if(fld==='material') l.material = el.value;
      else if(fld==='tValue') l.tValue = parseFloat(el.value)||0;
      else if(fld==='tUnit') l.tUnit = el.value;
    });
  });
  body.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = +btn.dataset.li, act = btn.dataset.act;
      if(act==='remove') skbDraft.layers.splice(i,1);
      else if(act==='up' && i>0){ const x=skbDraft.layers.splice(i,1)[0]; skbDraft.layers.splice(i-1,0,x); }
      else if(act==='down' && i<skbDraft.layers.length-1){ const x=skbDraft.layers.splice(i,1)[0]; skbDraft.layers.splice(i+1,0,x); }
      renderStackupEditor();
    });
  });
  body.querySelector('#skb-add-layer').addEventListener('click', ()=>{ skbDraft.layers.push(skNewLayer('copper')); renderStackupEditor(); });
  body.querySelector('#skb-name').addEventListener('input', e=> skbDraft.name = e.target.value);
  body.querySelector('#skb-substrate').addEventListener('input', e=> skbDraft.substrate = e.target.value);
  body.querySelector('#skb-price').addEventListener('change', e=> skbDraft.price = e.target.value);
  body.querySelectorAll('[data-imp]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const id = el.dataset.imp, fld = el.dataset.f;
      if(!skbDraft.imp[id]) skbDraft.imp[id] = {};
      skbDraft.imp[id][fld] = el.value;
      if(!skbDraft.imp[id].w && !skbDraft.imp[id].clearance) delete skbDraft.imp[id];
    });
  });
  body.querySelector('#skb-cancel').addEventListener('click', closeStackupEditor);
  if(skbDraft.id){
    body.querySelector('#skb-delete').addEventListener('click', ()=>{
      if(confirm('Delete "'+skbDraft.name+'"? This can\'t be undone.')){
        customStackups = customStackups.filter(c=>c.id!==skbDraft.id);
        saveCustomStackups();
        closeStackupEditor();
        refreshStackupBuilder();
      }
    });
  }
  body.querySelector('#skb-save').addEventListener('click', ()=>{
    if(!skbDraft.name.trim()){ alert('Please name this stackup.'); return; }
    if(skbDraft.layers.length<2 || skbDraft.layers[0].type!=='copper' || skbDraft.layers[skbDraft.layers.length-1].type!=='copper'){
      alert('A stackup should start and end with a copper layer.'); return;
    }
    const stack = skbDraft.layers.map(l=>({ type:l.type, label:skLayerLabel(l), t:skLayerMm(l), _raw:Object.assign({},l) }));
    const layerCount = skbDraft.layers.filter(l=>l.type==='copper').length;
    const obj = { id: skbDraft.id || ('custom-'+Date.now()), name:skbDraft.name.trim(), layers:layerCount,
      substrate: skbDraft.substrate.trim()||'Custom', price:skbDraft.price, stack, imp:skbDraft.imp, custom:true };
    if(skbDraft.id){ const idx = customStackups.findIndex(c=>c.id===skbDraft.id); customStackups[idx] = obj; }
    else customStackups.push(obj);
    saveCustomStackups();
    closeStackupEditor();
    refreshStackupBuilder();
  });
}

function dielectricTable(chosen){
  if(!chosen.length) return '<p class="placeholder" style="padding:40px 0">Select one or more materials to see their table.</p>';
  const rows = [
    ['grp','Electrical'],
    ['key','Dielectric Constant (εr / Dk)','er'],
    ['key','Dissipation Factor (tanδ / Df)','df'],
    ['','Thermal Coefficient of εr (TCDk)','tcdk'],
    ['grp','Thermal'],
    ['','Glass Transition Temp (Tg)','tg'],
    ['','Decomposition Temp (Td)','td'],
    ['','CTE, X/Y/Z (ppm/°C)','cte'],
    ['grp','Mechanical & Physical'],
    ['','Density','density'],
    ['','Moisture Absorption','moisture'],
    ['','Ultimate Stress (tensile unless noted)','stress'],
    ['','Ultimate Strain (elongation)','strain'],
    ['grp','Source'],
    ['','Manufacturer','mfr'],
  ];
  const rowsHTML = rows.map(([cls,label,key])=>{

  }).join('');
  return `<div style="overflow-x:auto"><table class="spec-table">

  {calc:'e-series', tabPath:[['e-series','near']], label:'Nearest Value', kw:['nearest resistor value','e12','e24','e48','e96']},
  {calc:'e-series', tabPath:[['e-series','combo']], label:'Best Two-Resistor Combo', kw:['two resistor combo','resistor combination','optimum','precise','lock']},
  {calc:'pinouts', tabPath:[['pinouts','usbc']], label:'USB-C', kw:['usb-c','usb c','type-c']},
  {calc:'pinouts', tabPath:[['pinouts','hdmi']], label:'HDMI', kw:['hdmi']},
  {calc:'pinouts', tabPath:[['pinouts','rj45']], label:'RJ45', kw:['rj45','ethernet']},
  {calc:'pinouts', tabPath:[['pinouts','jtag']], label:'JTAG / SWD', kw:['jtag','swd']},
  {calc:'pinouts', tabPath:[['pinouts','dp']], label:'DisplayPort', kw:['displayport','dp']},
  {calc:'pinouts', tabPath:[['pinouts','minidp']], label:'Mini DisplayPort', kw:['mini displayport','mini dp']},
  {calc:'stackup', tabPath:[['stackup','builder']], label:'Stackup Builder', kw:['stackup','layer stack','custom stackup']},
  {calc:'stackup', tabPath:[['stackup','dielectric']], label:'Dielectric', kw:['dielectric','dk','df','fr4','rogers','megtron','ro4003']},
];
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function searchMatch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const results = [];
  for(const c of CALCULATORS){
    if(!c.ready) continue;
    const hay = (c.title+' '+(c.sub||'')).toLowerCase();
    if(hay.includes(q)) results.push({calc:c.id, tabPath:null, title:c.title, sub:null});
  }
  for(const e of SEARCH_INDEX){
    const hay = (e.label+' '+e.kw.join(' ')).toLowerCase();
    if(hay.includes(q)){
      const meta = CALCULATORS.find(c=>c.id===e.calc);
      results.push({calc:e.calc, tabPath:e.tabPath, title: meta?meta.title:e.calc, sub:e.label});
    }
  }
  return results.slice(0,8);
}
function loadSearchHistory(){ return Store.load('search-history') || []; }
function saveSearchHistory(arr){ Store.save('search-history', arr); }
function addSearchHistory(q){
  q = q.trim(); if(!q) return;
  let hist = loadSearchHistory().filter(h=>h.toLowerCase()!==q.toLowerCase());
  hist.unshift(q);
  saveSearchHistory(hist.slice(0,10));
}

/* ---------- Backup & Restore ----------
   Schema is versioned so future app versions can detect and migrate older
   backups instead of silently misreading them. */
const APP_STORAGE_PREFIX = 'pcbcalc:';
const BACKUP_SCHEMA_VERSION = 1;
function exportBackup(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(APP_STORAGE_PREFIX)===0) data[k] = localStorage.getItem(k);
  }
  const payload = { app:'pcb-calc', schema:BACKUP_SCHEMA_VERSION, exportedAt:new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'pcb-calc-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let payload;
    try{ payload = JSON.parse(reader.result); }
    catch(e){ alert('This file is not valid JSON.'); return; }
    if(!payload || payload.app!=='pcb-calc' || typeof payload.data!=='object'){
      alert('This doesn\'t look like a PCB Calc backup file.'); return;
    }
    if(typeof payload.schema==='number' && payload.schema>BACKUP_SCHEMA_VERSION){
      if(!confirm('This backup was made by a newer version of PCB Calc. Attempt to restore it anyway?')) return;
    }
    if(!confirm('This replaces all calculator values, custom stackups, and settings currently saved on this device. Continue?')) return;
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(APP_STORAGE_PREFIX)===0) toRemove.push(k); }
    toRemove.forEach(k=>localStorage.removeItem(k));
    Object.keys(payload.data).forEach(k=>{ if(k.indexOf(APP_STORAGE_PREFIX)===0) localStorage.setItem(k, payload.data[k]); });
    alert('Backup restored. Reloading now.');
    location.reload();
  };
  reader.onerror = ()=> alert('Could not read that file.');
  reader.readAsText(file);
}
document.getElementById('settings-export').addEventListener('click', exportBackup);
document.getElementById('settings-import').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file) importBackupFile(file);
  e.target.value = '';
});

/* ---------- Search wiring ---------- */
const searchInput = document.getElementById('search-input');
const searchDropdown = document.getElementById('search-dropdown');
function searchRowHTML(r){
  return `<div class="search-row" data-goto data-calc="${r.calc}" data-tabpath='${escapeHtml(JSON.stringify(r.tabPath||[]))}'>
    <span class="sr-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
    <div><div class="sr-main">${escapeHtml(r.title)}</div>${r.sub?`<div class="sr-sub">${escapeHtml(r.sub)}</div>`:''}</div>
  </div>`;
}
function renderSearchDropdown(){
  const q = searchInput.value;
  if(q.trim()){
    const results = searchMatch(q);
    searchDropdown.innerHTML = results.length
      ? results.map(searchRowHTML).join('')
      : `<div class="search-empty">No matches for "${escapeHtml(q)}"</div>`;
    searchDropdown.querySelectorAll('[data-goto]').forEach(row=>{
      row.addEventListener('click', ()=>{
        addSearchHistory(searchInput.value);
        const tabPath = JSON.parse(row.dataset.tabpath || '[]');
        tabPath.forEach(([k,v])=> TabMemory.save(k,v));
        searchInput.value = '';
        searchDropdown.classList.add('hidden');
        searchInput.blur();
        location.hash = row.dataset.calc;
      });
    });
  } else {
    const hist = loadSearchHistory();
    if(!hist.length){
      searchDropdown.innerHTML = '<div class="search-empty">Start typing to search calculators, tabs, even sub-tabs…</div>';
    } else {
      searchDropdown.innerHTML = `<div class="search-hist-head">Recent searches<button id="search-clear-hist">Clear all</button></div>` +
        hist.map(h=>`<div class="search-row" data-hist="${escapeHtml(h)}">
          <span class="sr-icon">&#8635;</span><span class="sr-main">${escapeHtml(h)}</span>
          <button class="sr-del" data-del="${escapeHtml(h)}" title="Remove">&times;</button>
        </div>`).join('');
      searchDropdown.querySelector('#search-clear-hist').addEventListener('click', e=>{
        e.stopPropagation(); clearSearchHistory(); renderSearchDropdown();
      });
      searchDropdown.querySelectorAll('[data-del]').forEach(btn=> btn.addEventListener('click', e=>{
        e.stopPropagation(); removeSearchHistoryItem(btn.dataset.del); renderSearchDropdown();
      }));
      searchDropdown.querySelectorAll('[data-hist]').forEach(row=> row.addEventListener('click', ()=>{
        searchInput.value = row.dataset.hist; renderSearchDropdown(); searchInput.focus();
      }));
    }
  }
  searchDropdown.classList.remove('hidden');
}
function clearSearchHistory(){ saveSearchHistory([]); }
function removeSearchHistoryItem(q){ saveSearchHistory(loadSearchHistory().filter(h=>h!==q)); }
searchInput.addEventListener('input', renderSearchDropdown);
searchInput.addEventListener('focus', renderSearchDropdown);
searchInput.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ searchDropdown.classList.add('hidden'); searchInput.blur(); }
  if(e.key==='Enter'){ const first = searchDropdown.querySelector('[data-goto]'); if(first) first.click(); }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.search-box')) searchDropdown.classList.add('hidden');
});

window.addEventListener('resize', ()=>{ if(!App.currentId) renderIndex(document.getElementById('app-main')); });
navigateTo(currentRouteId());
